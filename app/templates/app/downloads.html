{% extends "app/layout.html" %}
{% load static %}
{% block content %}

<h2>Lab Files Repository</h2>
<p>Download available lab files below:</p>

<div class="list-group">
    {% for file in files %}
    <a href="{{ file.url }}" class="list-group-item" download>
        <h4 class="list-group-item-heading">{{ file.name }}</h4>
        <p class="list-group-item-text">{{ file.size|filesizeformat }}</p>
    </a>
    {% empty %}
    <p class="text-muted">No files available</p>
    {% endfor %}
</div>

{% endblock %}
